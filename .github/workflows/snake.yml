name: Generate contribution snake

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    # Publishing SVGs to output needs contents: write; all other permissions stay disabled.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate light and dark SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: lucklyt
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify generated SVGs
        shell: bash
        run: |
          set -euo pipefail
          for file in dist/github-contribution-grid-snake{,-dark}.svg; do
            test -s "$file"
            grep -q '<svg' "$file"
          done

      - name: Publish SVGs to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true
          commit_message: 'chore: update contribution snake'
